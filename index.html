<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Catálogo de bolso do vendedor. Roda no celular (e, mais à frente,
         dentro de um wrapper iOS/Android), por isso o tema escuro fixo e a
         barra de status translúcida: o cabeçalho continua atrás do relógio. -->
    <meta name="theme-color" content="#0b1526" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Catálogo Linde" />

    <!-- Só os pesos que a primeira tela usa (corpo 500, títulos 700/800).
         Sem o preload o navegador só descobre a fonte depois de baixar o CSS
         e o texto troca de forma no meio do caminho. crossorigin é
         obrigatório em preload de fonte, mesmo na mesma origem. -->
    <link rel="preload" href="/font/Rotunda-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/font/Rotunda-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/font/Rotunda-ExtraBold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/images/logonavbar.webp" as="image" type="image/webp" />

    <title>Linde Vidros — Catálogo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
